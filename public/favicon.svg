  <!-- Wheels / Neon Accents -->
  <circle cx="21" cy="42" r="5" fill="#180e2e" stroke="url(#neonEmerald)" stroke-width="2"/>
  <circle cx="45" cy="42" r="5" fill="#180e2e" stroke="url(#neonEmerald)" stroke-width="2"/>
  <circle cx="21" cy="42" r="2" fill="url(#neonEmerald)"/>
  <circle cx="45" cy="42" r="2" fill="url(#neonEmerald)"/>
